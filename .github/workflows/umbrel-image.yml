name: Umbrel image
on:
  push:
    branches: [feat/nexus-ai-os]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: NEXUS_ALLOW_HTTP=1
          tags: |
            ghcr.io/dpksh22-art/nexus-ai-os:latest
            ghcr.io/dpksh22-art/nexus-ai-os:${{ github.sha }}
