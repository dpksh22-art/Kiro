services:
  nexus:
    build: .
    image: nexus-ai-os:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXUS_DATABASE_PATH: /app/data/nexus.db
      NEXUS_ARTIFACT_ROOT: /app/data/artifacts
    ports:
      - "3000:3000"
    volumes:
      - nexus-data:/app/data
    deploy:
      replicas: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  nexus-data:
